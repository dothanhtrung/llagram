[package]
name = "llagram"
edition = "2024"
version = "0.0.1"

[dependencies]
teloxide = {version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"]}
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
serde = {version = "1.0", features = ["derive"]}
serde_json = "1"
ron = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "stream", "rustls"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.7"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1 # Enable a small amount of optimization in debug mode

[profile.dev.package."*"]
opt-level = 3
